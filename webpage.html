<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webpage Design</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .main{
            width: 100%;
            background: linear-gradient(to top,rgba(0,0,0,0.5)50%,rgba(0,0,0,0.5)50%),url(../photos1/webimage.jpg);
            background-position: center;
            background-size: cover;
            height: 100vh;

        }
        .navbar{
            width: 1200px;
            height: 75px;
            margin: auto;
        }
        .icon img{
            width: 40px;
            float: left;
            height: 40px;
            background-color: #000;
            margin: 0 20px;
        }
        .logo{
            color: red;
            font-size: 35px;
            font-family: Arial;
           padding-left: 20px;
           float: left;
           padding-top: 10px;
           margin-top: 5px;
        }
        .logo img{
            /* margin-top: 2px; */
            /* padding: 20px; */
            /* background-color: #000; */
            padding-left: 20px;
           float: right;
           padding-top: 5px;
           /* margin-top: 0px; */
           
           
        }
        .menu{
            width: 400px;
            float: left;
            height: 70px;

        }
        ul{
            float: left;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        ul li{
            list-style: none;
            margin-left: 62px;
            margin-top: 27px;
            font-size: 14px;
        }
        ul li a{
            text-decoration: none;
            color: red;
            font-family: arial;
            font-weight: bold;
            transition: 0.4s ease-in-out;
            /* padding-left: 80px; */

        }
        ul li a:hover{
            color: white;
        }
        .search{
            width: 330px;
            float: right;
            margin-left: 400px;
            margin-top: 5px;
        }
        .srch{
            font-family: 'Times New Roman';
            width: 200px;
            height: 40px;
            background: transparent;
            border: 1px solid orangered;
            margin-top: 13px;
            color: white;
            border-right: none;
            font-size: 16px;
            float: left;
            padding: 10px;
            border-bottom-left-radius: 5px;
            border-top-left-radius: 5px;
            margin-top: 5px;
            /* border-top-right-radius: 5px; */
        }
        .btn{
            width: 100px;
            height: 40px;
            background: orangered;
            border: 2px solid orangered;
            margin-top: 13px;
            color: white;
            font-size: 15px;
            border-bottom-right-radius: 5px;
            border-bottom-right-radius: 5px;
            transition: 0.2s ease;
            cursor: pointer;
            margin-top: 5px;
            
        }
        .btn:hover{
            color: #000;
        }
        .btn:focus{
            outline: none;

        }
        .srch:focus{
            outline: none;
        }
        .content{
            width: 1200px;
            height: auto;
            margin: auto;
            color: white;
            position: relative;
        }
        .content .par{
            padding-left: 20px;
            padding-bottom: 25px;
            font-family: Arial;
            letter-spacing: 1.2px;
            line-height: 30px;

        }
        .content h1{
            font-family: 'Times New Roman';
            font-size: 50px;
            padding-left: 20px;
            margin-top: 9%;
            letter-spacing: 2px;
        }
        .content .cn{
            width: 160px;
            height: 40px;
            background: orangered;
            border: none;
            margin-bottom: 10px;
            margin-left: 20px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: .4s ease;
        }
        .content .cn a{
            text-decoration: none;
            color: black;
            transition: .3s ease;
        }
        .cn:hover{
            background-color: white;
        }
        .content span{
            color: orangered;
            font-size: 60px;
        }
        .form{
            width: 250px;
            height: 380px;
            background: linear-gradient(to top,rgba(0,0,0,0.8)50%,rgba(0,0,0,0.8)50%);
            position: absolute;
            top: -20px;
            left: 870px;
            border-radius: 10px;
            padding: 25px;
        }
        .form h2{
            width: 220px;
            font-family: sans-serif;
            text-align: center;
            color: orangered;
            font-size: 22px;
            background-color: white;
            border: 10px;
            margin: 2px;
            padding: 8px;
        }
        .form input{
            width: 240px;
            height: 35px;
            background-color: transparent;
            border-bottom: 1px solid orangered;
            border-top: none;
            border-right: none;
            border-left: none;
            color: white;
            font-size: 15px;
            letter-spacing: 1px;
            margin-top: 30px;
            font-family: sans-serif;
        }
        .form input:focus{
            outline: none;
        }
        ::placeholder{
            color: white;
            font-family: Arial;
        }
        .btnn{
            width: 240px;
            height: 40px;
            background: orangered;
            border: none;
            margin-top: 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            color: white;
        }
        .btnn:hover{
            background: white;
            color: orangered;
        }
        .btnn a{
            text-decoration: none;
            color: black;
            font-weight: bold;
        }
        .form .link{
            font-family: Arial,Arial, Helvetica, sans-serif;
            font-size: 17px;
            padding-top: 20px;
            text-align: center;
        }
        .form .link a{
            text-decoration: none;
            color: orangered;
        }
        .liw{
            padding-top: 15px;
            padding-bottom: 10px;
            text-align: center;
        }
        .icons a{
            text-decoration: none;
            color: white;
        }
        .icons ion-icon{
            color: white;
            font-size: 30px;
            padding-left: 14px;
            padding-top: 5px;
            transition: 0.3s ease;
        }
        .icons ion-icon:hover{
            color: orangered;
        }
        

    </style>
</head>
<body>
    <div class="main">
        <div class="navbar">
            <div class="icon">
                <h2 class="logo">Orbit <img src="../photos1/Orbitlogo.png"></h2>
                
            </div>
            <div class="menu">
                <ul>
                    <li><a href="#">HOME</a></li>
                    <li><a href="#">ABOUT</a></li>
                    <li><a href="#">SERVICE</a></li>
                    <li><a href="#">DESIGN</a></li>
                    <li><a href="#">CONTACT</a></li>
                </ul>
            </div>
            <div class="search">
                
                <input class="srch"  type="search" name="" placeholder="Type to text">
                 
                <a href="#"><button class="btn">Search</button></a>
            </div>
        </div>
        <div class="content">
            <h1>Web Design &<br/> <span> Development</span> <br/>Course</h1>
            <p class="par"> Learn connect and explore with web development<br/> at Orbit Institute.    </p>
            <br/><br/>
            <button class="cn"><a href="#">JOIN US</a></button>

            <div class="form">
                <h2>Login Here</h2>
                <input type="email" name="email" placeholder="Enter email here">
                <input type="password" name="" placeholder="Enter password here">
                <button class="btnn"><a href="#">Login</a></button>

                <p class="link">Don't have an account<br/>
                <a href="#">Sign up</a> here</a></p>
                <p class="liw">Log in with</p>

                <div class="icon">
                    <a href="">
                        <img src="../photos1/googleicon.png">
                        <img src="../photos1/facebookicon.jpg">
                        <img src="../photos1/linkedinicon.png">
                    </a>
                    <a href="#"><icon-icon name="logo-facebook"></icon-icon></a>
                    <a href="#"><icon-icon name="logo-instagarm"></icon-icon></a>
                    <a href="#"><icon-icon name="logo-twitter"></icon-icon></a>
                    <a href="#"><icon-icon name="logo-google"></icon-icon></a>
                </div>
                   
                
            </div>
        </div>
    </div>
    
</body>
</html>
